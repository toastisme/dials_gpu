[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dials_gpu"
version = "0.1.0"
description = "GPU-accelerated DIALS algorithms using PyTorch"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch",
]

[project.scripts]
"dials_gpu.find_spots" = "dials_gpu.command_line.find_spots:run"
"dials_gpu.index" = "dials_gpu.command_line.index:run"
"dials_gpu.refine" = "dials_gpu.command_line.refine:run"
"dials_gpu.integrate" = "dials_gpu.command_line.integrate:run"
"dials_gpu.interate" = "dials_gpu.command_line.integrate:run"
"dials_gpu.scale" = "dials_gpu.command_line.scale:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = ["--regression"]
